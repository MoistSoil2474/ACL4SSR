; ===== 优化 DNS 分流配置 (redir-host, 国内精准匹配, IPv4-only) =====
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  
  enhanced-mode: redir-host

  # 默认 DNS（兜底用，仅 IPv4）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 主上游 DNS（国外域名，加密 DoH，仅 IPv4）
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # fallback DNS
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 分流策略
  nameserver-policy:
    # 国内网站走运营商 IPv4 DNS
    'geosite:cn,geosite:private': 
      - 223.5.5.5
      - 119.29.29.29
    # 国外网站走加密 DoH
    'geosite:!cn': 
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  # fallback 过滤，只对国外 IP 生效
  fallback-filter:
    geoip: true

  # 私网 / 保留网段，不走代理
  ipcidr:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.18.0.0/15
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 255.255.255.255/32
